[tool.poetry]
name = "pyoslom"
version = "0.3.0"
description = "Python Wrapper for OSLOM - Rust Implementation"
authors = ["Bo Chen <bochen0909@gmail.com>"]
maintainers = ["Bo Chen <bochen0909@gmail.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/bochen0909/pyoslom"
repository = "https://github.com/bochen0909/pyoslom"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[tool.poetry.dependencies]
python = ">=3.9"
scikit-learn = ">=1.0.0"
networkx = ">=2.5"
numpy = ">=2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
maturin = ">=1.0.0"

[build-system]
requires = ["poetry-core", "maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
module-name = "pyoslom._rust"
manifest-path = "rust/oslom-python/Cargo.toml"

[tool.poetry.scripts]
test = "pytest"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]