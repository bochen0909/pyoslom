[workspace]
members = [
    "oslom-core",
    "oslom-python",
]
resolver = "2"

[workspace.dependencies]
petgraph = "0.6"
ndarray = "0.15"
rand = "0.8"
rayon = "1.7"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
pyo3 = { version = "0.20", features = ["extension-module"] }
numpy = "0.20"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"